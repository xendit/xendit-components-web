- pipeline: "Sync Lokalise to Git"
  trigger_mode: "MANUAL"
  ref_name: "main"
  ref_type: "BRANCH"
  priority: "NORMAL"
  always_from_scratch: true
  trigger_condition: "ALWAYS"
  actions:
    - action: "Download translations and create PR"
      type: "BUILD"
      working_directory: "/buddy/xendit-components-web"
      docker_image_name: "library/alpine"
      docker_image_tag: "latest"
      execute_commands:
        - "apk add --no-cache curl jq unzip git"
        - "export LOKALISE_PROJECT_ID"
        - "export LOKALISE_API_TOKEN"
        - "export GITHUB_TOKEN"
        - "./lokalise-download.sh"
      volume_mappings:
        - "/:/buddy/xendit-components-web"
      shell: "SH"
